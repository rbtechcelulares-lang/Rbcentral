<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0b">
  <title>RB Central</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=9">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <div class="cerebro cerebro-login" id="cerebro-login" aria-hidden="true"></div>
    <form class="login-box" id="login-form">
      <div class="marca">RB <b>Central</b></div>
      <p class="muted">Assistente de gestão da RB Tech. Entre com a <b>mesma senha do admin do site</b>.</p>
      <label class="campo"><span>Senha</span><input type="password" id="senha" autocomplete="current-password" required></label>
      <p class="erro" id="login-erro" hidden></p>
      <button class="btn btn-ouro" type="submit">Entrar</button>
    </form>
  </section>

  <!-- App -->
  <section id="app" class="app" hidden>
    <header class="topo">
      <div class="marca">RB <b>Central</b></div>
      <div class="conexoes" id="conexoes"></div>
      <div class="topo-acoes">
        <button class="btn-mini" id="hist-btn" title="Últimas conversas" aria-label="Últimas conversas" aria-expanded="false" aria-controls="hist"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4h4M12 7.5V12l3 2"/></svg></span><span class="tx">Conversas</span></button>
        <button class="btn-mini" id="limpar" title="Nova conversa" aria-label="Nova conversa"><span class="ic">＋</span><span class="tx">Nova conversa</span></button>
        <button class="btn-mini" id="sair" title="Sair">Sair</button>
      </div>
    </header>
    <div class="hist" id="hist" hidden>
      <div class="hist-fundo" data-fechar></div>
      <div class="hist-painel" role="dialog" aria-label="Últimas conversas">
        <div class="hist-topo"><b>Últimas conversas</b><button type="button" class="btn-mini" data-fechar aria-label="Fechar">✕</button></div>
        <button type="button" class="hist-nova" id="hist-nova">＋ Nova conversa</button>
        <ul class="hist-lista" id="hist-lista"></ul>
        <p class="hist-nota" id="hist-nota">Guardo as 6 últimas conversas.</p>
        <button type="button" class="hist-sql" id="hist-sql" hidden>Copiar o SQL para ligar a nuvem</button>
      </div>
    </div>
    <div class="cerebro" id="cerebro">
      <button type="button" class="cb-recolher" id="cb-recolher" aria-expanded="true" title="Recolher o cérebro">▴</button>
      <div class="cerebro-desenho" id="cerebro-desenho"></div>
      <p class="cb-dica">Toque num neurônio para abrir aquele sistema</p>
    </div>
    <main class="conversa" id="conversa" aria-live="polite"></main>
    <form class="enviar" id="enviar">
      <textarea id="msg" rows="1" maxlength="2000" enterkeyhint="enter" placeholder="O que você precisa?"></textarea>
      <button type="button" class="btn-mic" id="mic" aria-label="Falar com o RB Central" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      </button>
      <button class="btn btn-ouro" type="submit" aria-label="Enviar">➤</button>
    </form>
  </section>

  <script src="assets/cerebro.js?v=5"></script>
  <script src="assets/app.js?v=10"></script>
</body>
</html>
